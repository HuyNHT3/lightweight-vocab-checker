<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Quiz - Setup</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header-content">
            <img src="assets/main_logo.png" alt="App Logo" class="app-logo" width="200" height="100">
            <h1>Luyện Từ Vựng</h1>
        </div>
        <div class="setup-form">
            <div class="form-group">
                <div class="topic-header-bar">
                    <label>Chọn bộ từ:</label>
                    <div class="merge-toggle-wrapper">
                        <span class="merge-toggle-label">Gộp chủ đề</span>
                        <label class="toggle-switch" title="Bật/Tắt chế độ gộp nhiều chủ đề kiểm tra">
                            <input type="checkbox" id="merge-toggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div id="merge-actions-bar" class="merge-actions-bar hidden">
                    <div class="merge-info-badge">
                        Đã chọn: <strong id="selected-count">0</strong> chủ đề (<strong id="total-words-count">0</strong> từ)
                    </div>
                    <div class="merge-quick-btns">
                        <button type="button" id="select-all-btn" class="btn-sm">Chọn tất cả</button>
                        <button type="button" id="deselect-all-btn" class="btn-sm btn-outline">Bỏ chọn</button>
                    </div>
                </div>

                <div class="search-box">
                    <input type="text" id="topic-search" placeholder="Tìm kiếm chủ đề...">
                </div>
                
                <div id="topic-grid" class="topic-grid">
                    <!-- Cards will be injected here -->
                </div>

                <div id="pagination" class="pagination-ctrl">
                    <!-- Pagination buttons -->
                </div>
            </div>
            
            <div class="form-group">
                <label for="word-count">Số lượng câu hỏi:</label>
                <input type="number" id="word-count" min="1" max="50" value="10">
            </div>
            
            <div class="form-group">
                <label for="quiz-mode">Chế độ:</label>
                <select id="quiz-mode">
                    <option value="normal">Bình thường</option>
                    <option value="trick">Trick Mode (Hạn giờ + Anti-cheat)</option>
                </select>
            </div>
            
            <button id="start-btn" class="btn-primary">Bắt đầu</button>
        </div>
    </div>

    <!-- Custom Cursor Structure -->
    <div id="custom-cursor-container">
        <img src="assets/mec-cursor.gif" alt="" class="cursor-gif">
    </div>

    <script src="js/config.js"></script>
    <script src="js/vocab-service.js"></script>
    <script src="js/storage-service.js"></script>
    <script src="js/index.js"></script>
    <script src="js/custom-cursor.js"></script>
</body>
</html>
